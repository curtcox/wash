[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdt"
version = "0.1.0"
description = "Sequential Directory Tree tools (name-resolution linter)"
requires-python = ">=3.11"

[project.scripts]
sdt = "sdt.cli:main"

[tool.setuptools.packages.find]
include = ["sdt*"]

[tool.pytest.ini_options]
pythonpath = ["."]
