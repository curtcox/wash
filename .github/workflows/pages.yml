name: wash developer site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run cancel an in-flight one, but never interrupt a live deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so per-impl "last changed" is accurate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install harness, reference impl, and build deps
        run: |
          pip install -e "./harness[dev]"
          pip install -e ./impls/reference
          pip install markdown

      - name: Collect data (runs toolchains + conformance)
        run: python docs/gen/collect.py

      - name: Render site
        run: python docs/gen/render.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
