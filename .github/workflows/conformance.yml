name: wash conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness
        run: pip install -e "./harness[dev]"
      - name: Install reference implementation
        run: pip install -e ./impls/reference
      - name: Validate corpus
        run: |
          wash-conformance validate-roots
          wash-conformance validate-vectors
          wash-conformance validate-capabilities harness/adapters/reference.toml
          wash-conformance validate-capabilities harness/adapters/go.toml
          wash-conformance validate-capabilities harness/adapters/dart.toml
          wash-conformance coverage
      - name: Harness self-tests
        run: cd harness && python -m pytest -q
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Check book links
        run: make check-book

  conformance:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          pip install -e "./harness[dev]"
          pip install -e ./impls/reference
      - name: Run conformance against reference
        run: wash-conformance run --adapter harness/adapters/reference.toml

  conformance-go:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness
        run: pip install -e "./harness[dev]"
      - name: Run Go lint, unit tests, and conformance
        run: make test-go-all

  conformance-dart:
    runs-on: ${{ matrix.os }}
    needs: validate
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pub + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            impls/dart/.dart_tool
          key: pub-${{ matrix.os }}-${{ hashFiles('impls/dart/pubspec.yaml') }}
      - name: Install harness
        run: pip install -e "./harness[dev]"
      - name: Run Dart lint, unit tests, and conformance
        run: make test-dart-all
