name: wash conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness
        run: pip install -e "./harness[dev]"
      - name: Install reference implementation
        run: pip install -e ./impls/reference
      - name: Validate corpus
        run: |
          wash-conformance validate-roots
          wash-conformance validate-vectors
          wash-conformance validate-capabilities harness/adapters/reference.toml
          wash-conformance coverage
      - name: Harness self-tests
        run: cd harness && python -m pytest -q
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck

  conformance:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          pip install -e "./harness[dev]"
          pip install -e ./impls/reference
      - name: Run conformance against reference
        run: wash-conformance run --adapter harness/adapters/reference.toml
