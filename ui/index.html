<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>wash</title>
    <link rel="stylesheet" href="/ui/style.css">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <div id="posture-banner" class="banner" hidden></div>
    <div id="integrity-banner" class="banner" hidden></div>
    <header class="topbar">
      <a class="brand" href="/ui/">wash</a>
      <form id="goto-form" class="goto">
        <input id="goto-input" name="path" list="path-options" autocomplete="off" spellcheck="false" aria-label="Path">
        <datalist id="path-options"></datalist>
        <button type="submit">Go</button>
        <output id="canonical-preview" class="preview" aria-live="polite"></output>
      </form>
      <nav class="actions" aria-label="View actions">
        <a id="raw-link" href="/">Raw</a>
        <button id="reload-button" type="button">Reload</button>
        <button id="shell-button" type="button">Shell</button>
      </nav>
    </header>
    <main class="layout">
      <section class="viewer" aria-live="polite">
        <nav class="view-tabs" aria-label="View mode">
          <a id="thread-view-link" href="/ui/">Thread</a>
          <a id="files-view-link" href="#files">Files</a>
          <a id="content-view-link" href="#content">Content</a>
        </nav>
        <div id="status" class="status"></div>
        <div id="node-kind" class="node-kind"></div>
        <div id="author-panel" class="author-panel" hidden></div>
        <div id="thread-panel" class="thread-panel" hidden></div>
        <div id="files-panel" class="files-panel" hidden></div>
        <div id="content" class="content"></div>
      </section>
      <aside class="side">
        <section>
          <h2>Root</h2>
          <dl id="root-panel"></dl>
        </section>
        <section>
          <h2>What Ran</h2>
          <div id="explain-panel"></div>
          <dl id="run-panel"></dl>
        </section>
        <section>
          <h2>Resolved Path</h2>
          <div id="resolved-panel"></div>
        </section>
        <section>
          <h2>Backing Files</h2>
          <dl id="backing-panel"></dl>
        </section>
        <section>
          <h2>Names</h2>
          <div id="names-panel" class="panel-list"></div>
        </section>
        <section>
          <h2>Commands</h2>
          <div id="commands-panel" class="panel-list"></div>
        </section>
        <section>
          <h2>Help</h2>
          <div id="help-panel" class="panel-list"></div>
        </section>
      </aside>
    </main>
    <script type="module" src="/ui/app.js"></script>
  </body>
</html>
