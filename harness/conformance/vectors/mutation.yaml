- id: mut-put-replace-literal
  clauses: [RT-9.2-put-literal, RT-13.2-mutating-methods]
  tier: MUST
  root: mutation
  request:
    method: PUT
    target: "/writable/existing.txt"
    body_exact: "replaced-bytes\n"
  expect:
    status: 200
    mutation:
      path: writable/existing.txt
      action: replaced
      bytes: "replaced-bytes\n"
    when_writes_disabled:
      status_any: [403, 405]
      no_mutation: true

- id: mut-put-create-literal
  clauses: [RT-9.2-put-literal]
  tier: MUST
  root: mutation
  request:
    method: PUT
    target: "/writable/newfile.txt"
    body_exact: "created-bytes\n"
