- id: mut-post-plain-405
  clauses: [RT-9.3-post-plain-405]
  tier: MUST
  root: mutation
  request:
    method: POST
    target: "/writable/existing.txt"
    body_exact: "post-body\n"
  expect:
    status: 405
    no_mutation: true

- id: mut-post-command-write
  clauses: [RT-13.2-mutating-methods]
  tier: MUST
  root: mutation
  request:
    method: POST
    target: "/sort/writable%2Fsorted.txt"
    body_exact: "zebra\nalpha\n"
  expect:
    status: 200
    mutation:
      path: writable/sorted.txt
      action: created
      bytes: "alpha\nzebra\n"
