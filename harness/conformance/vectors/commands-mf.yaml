- id: mf-implied-cat-identity
  clauses: [PP-4-implied-cat, PP-2-parse-algo]
  tier: MUST
  root: commands-mf
  request: { method: GET, target: "/identity/data.txt" }
  expect:
    status: 200
    body_exact: |
      identity():alpha
      identity():bravo
      identity():charlie
    no_mutation: true

