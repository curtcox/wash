[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wash"
version = "0.1.0"
description = "Reference wash URL filesystem router runtime"
requires-python = ">=3.11"
dependencies = []

[project.scripts]

[tool.setuptools.packages.find]
where = ["."]
include = ["wash*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
files = [
    "wash",
]
